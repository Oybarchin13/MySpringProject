spring.application.name=FoodSwift

# --- DATABASE CONFIGURATION ---
# Agar alohida baza ochgan bo'lsangiz, URL oxiridagi 'postgres' ni o'zgartiring
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=1303
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / HIBERNATE CONFIGURATION ---
# ddl-auto=update bazadagi bor jadvallarga zarar yetkazmay, yangilarini qo'shadi
spring.jpa.hibernate.ddl-auto=update

# SQL so'rovlarni konsolda chiroyli ko'rish uchun
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- THYMELEAF CONFIGURATION ---
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# Dasturlash jarayonida o'zgarishlar darrov ko'rinishi uchun kesh o'chirilgan
spring.thymeleaf.cache=false