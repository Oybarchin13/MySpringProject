<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uz">
<head>
    <meta charset="UTF-8">
    <title>FoodSwift – Foydalanuvchilar</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: sidebar}"></div>
<div th:replace="~{fragments/header :: top-header}"></div>

<main class="fs-main--admin">
    <div class="fs-page">

        <div class="fs-page-header">
            <div>
                <h1 class="fs-page-title">Foydalanuvchilar</h1>
                <p class="fs-page-sub">Rollarni boshqarish va biriktirishingiz mumkin</p>
            </div>
            <a th:href="@{/users/create}" class="fs-btn fs-btn--primary">
                <i class='bx bx-plus'></i> Yangi qo'shish
            </a>
        </div>

        <div th:if="${successMessage}" class="fs-alert fs-alert--success">
            <i class='bx bx-check-circle'></i>
            <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="fs-alert fs-alert--error">
            <i class='bx bx-error-circle'></i>
            <span th:text="${errorMessage}"></span>
        </div>

        <div class="fs-panel">
            <table class="fs-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>To'liq ismi</th>
                        <th>Telefon raqami</th>
                        <th>Roli</th>
                        <th style="text-align:right;">Amallar</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user, iter : ${users}">
                        <td style="color:var(--gray-3); font-weight:600;" th:text="${iter.index + 1 + (currentPage * size)}">1</td>
                        <td style="font-weight:700; color:var(--dark);">
                            <a th:href="@{/users/{id}(id=${user.id})}" th:text="${user.fullName}"
                               style="transition:color 0.15s;" onmouseover="this.style.color='var(--primary-dk)'" onmouseout="this.style.color='var(--dark)'">Foydalanuvchi</a>
                        </td>
                        <td th:text="${user.phoneNumber}" style="color:var(--gray-4);">+998 90 000 00 00</td>
                        <td>
                            <span th:if="${user.role == null}" class="fs-badge fs-badge--gray">ROL YO'Q</span>
                            <span th:if="${user.role?.name() == 'ADMIN'}" class="fs-badge fs-badge--red">ADMIN</span>
                            <span th:if="${user.role?.name() == 'YETKAZUVCHI'}" class="fs-badge fs-badge--orange">YETKAZUVCHI</span>
                            <span th:if="${user.role?.name() == 'FOYDALANUVCHI'}" class="fs-badge fs-badge--green">FOYDALANUVCHI</span>
                        </td>
                        <td style="text-align:right;">
                            <div style="display:flex; justify-content:flex-end; gap:8px;">
                                <a th:href="@{/users/{id}/edit(id=${user.id})}" class="fs-btn fs-btn--blue-ghost fs-btn--sm">
                                    <i class='bx bx-edit-alt'></i>
                                </a>
                                <form th:action="@{/users/{id}/delete(id=${user.id})}" method="POST" style="display:inline-block;"
                                      onsubmit="return confirm('Haqiqatan ham ushbu foydalanuvchini o\'chirmoqchimisiz?')">
                                    <button type="submit" class="fs-btn fs-btn--danger-ghost fs-btn--sm">
                                        <i class='bx bx-trash'></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div style="padding:14px 20px; border-top:1.5px solid var(--gray-2); display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size:13px; color:var(--gray-3); font-weight:600;">Jami</span>
                <span style="font-size:13px; font-weight:700; color:var(--dark);" th:text="${totalItems} + ' ta akkaunt'">0 ta akkaunt</span>
            </div>
        </div>
    </div>
</main>

<script src="/js/main.js"></script>
</body>
</html>
