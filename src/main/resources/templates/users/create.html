<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uz">
<head>
    <meta charset="UTF-8">
    <title>FoodSwift – Foydalanuvchi Qo'shish</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: sidebar}"></div>
<div th:replace="~{fragments/header :: top-header}"></div>

<main class="fs-main--admin">
    <div class="fs-page">
        <div style="max-width:480px;">

            <div class="fs-page-header" style="margin-bottom:24px;">
                <div>
                    <a th:href="@{/users}" class="fs-back-link">
                        <i class='bx bx-left-arrow-alt'></i> Foydalanuvchilarga qaytish
                    </a>
                    <h1 class="fs-page-title">Yangi foydalanuvchi</h1>
                    <p class="fs-page-sub">Tizimga yangi foydalanuvchi qo'shish</p>
                </div>
            </div>

            <div class="fs-panel">
                <form th:action="@{/users/create}" th:object="${userSaveDto}" method="POST">
                    <div class="fs-panel__body">
                        <div class="fs-field">
                            <label class="fs-label">To'liq ismi</label>
                            <input type="text" th:field="*{fullName}" class="fs-input"
                                   placeholder="Abdulaziz Ochilov" required>
                        </div>
                        <div class="fs-field">
                            <label class="fs-label">Telefon raqami</label>
                            <input type="text" th:field="*{phoneNumber}" class="fs-input"
                                   placeholder="+998901234567" required>
                        </div>
                        <div class="fs-field">
                            <label class="fs-label">Parol</label>
                            <input type="password" th:field="*{password}" class="fs-input" required>
                        </div>
                        <div class="fs-field" style="margin-bottom:0;">
                            <label class="fs-label">Tizimdagi roli</label>
                            <div class="fs-select-wrap">
                                <select th:field="*{roleName}" class="fs-select">
                                    <option value="ADMIN">ADMIN</option>
                                    <option value="YETKAZUVCHI">YETKAZUVCHI</option>
                                    <option value="FOYDALANUVCHI">FOYDALANUVCHI</option>
                                </select>
                                <i class='bx bx-chevron-down'></i>
                            </div>
                        </div>
                    </div>
                    <div class="fs-panel__footer">
                        <a th:href="@{/users}" class="fs-btn fs-btn--danger-ghost">Bekor qilish</a>
                        <button type="submit" class="fs-btn fs-btn--primary">
                            <i class='bx bx-check'></i> Saqlash
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </div>
</main>

<script src="/js/main.js"></script>
</body>
</html>
