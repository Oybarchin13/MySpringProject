<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uz">
<head>
  <meta charset="UTF-8">
  <title>FoodSwift - Qo'shish</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body class="bg-gray-100 min-h-screen flex">
<div th:replace="~{fragments/navbar :: sidebar}"></div>
<div class="flex-1 pl-64 flex flex-col">
  <div th:replace="~{fragments/header :: top-header}"></div>

  <div class="p-10  pt-20">
    <div class="max-w-md mx-auto bg-white p-8 rounded-2xl border border-gray-200 shadow-sm">
      <h2 class="text-2xl font-extrabold text-gray-900 mb-6">Yangi foydalanuvchi qo'shish</h2>
      <form th:action="@{/users/create}" th:object="${userSaveDto}" method="POST" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-gray-400">To'liq ismi</label>
          <input type="text" th:field="*{fullName}" required class="mt-1 block w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-gray-400">Telefon raqami</label>
          <input type="text" th:field="*{phoneNumber}" placeholder="+998901234567" required class="mt-1 block w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-gray-400">Parol</label>
          <input type="password" th:field="*{password}" required class="mt-1 block w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-gray-400">Tizimdagi roli</label>
          <select th:field="*{role}" class="mt-1 block w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 text-sm">
            <option value="ADMIN">ADMIN</option>
            <option value="YETKAZUVCHI">YETKAZUVCHI</option>
            <option value="FOYDALANUVCHI">FOYDALANUVCHI</option>
          </select>
        </div>
        <div class="flex items-center justify-end space-x-4 pt-4 border-t border-gray-50 mt-6">
          <a th:href="@{/users}" style="background-color: #DF3535" class="px-5 py-2.5 text-sm font-bold text-white rounded-xl shadow-sm transition-all">Bekor qilish</a>
          <button type="submit" style="background-color: #FFEC00" class="px-5 py-2.5 hover:bg-orange-600  text-sm font-bold rounded-xl shadow-sm transition-all">Saqlash</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="/js/main.js"></script>
</body>
</html>
