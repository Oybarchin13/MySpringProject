<!DOCTYPE html>
    <html lang="uz" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tizimga kirish - FoodSwift</title>
    <link rel="stylesheet" href="/css/login.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

</head>
<body>

<!-- Floating food icons -->
<div class="food-float fc-1"><div class="emoji">🍔</div><span>Burger</span></div>
<div class="food-float fc-2"><div class="emoji">🍕</div><span>Pizza</span></div>
<div class="food-float fc-3"><div class="emoji">🥗</div><span>Salat</span></div>
<div class="food-float fc-4"><div class="emoji">🥤</div><span>Drinks</span></div>
<div class="food-float fc-5"><div class="emoji">🍜</div><span>Lag'mon</span></div>
<div class="food-float fc-6"><div class="emoji">🍰</div><span>Desert</span></div>

<!-- Card -->
<div class="card">

    <!-- Logo -->
    <div class="logo-wrap">
        <div class="logo-row">
            <div class="logo-icon">🍕</div>
            <span class="logo-name">FoodSwift</span>
        </div>
        <span class="logo-sub">Yetkazib berish</span>
    </div>

    <!-- Alerts -->
    <div th:if="${param.error}" class="alert alert--error">
        <i class='bx bx-error-circle'></i>
        <span>Telefon raqam yoki parol noto'g'ri!</span>
    </div>
    <div th:if="${successMessage}" class="alert alert--success">
        <i class='bx bx-check-circle'></i>
        <span th:text="${successMessage}"></span>
    </div>

    <!-- Form -->
    <form th:action="@{/auth/login}" method="POST">

        <div class="field">
            <label for="username">Telefon raqam</label>
            <div class="input-wrap">
                <input type="tel" id="username" name="username" required placeholder="+998 90 123 45 67">
                <i class='bx bx-phone'></i>
            </div>
        </div>

        <div class="field">
            <div class="field-row">
                <label for="password">Parol</label>
                <a href="#">Unutdingizmi?</a>
            </div>
            <div class="input-wrap">
                <input type="password" id="password" name="password" required placeholder="••••••••">
                <i class='bx bx-lock-alt'></i>
                <button type="button" class="eye-toggle" onclick="togglePwd('password', this)">
                    <i class='bx bx-hide' id="eye-login"></i>
                </button>
            </div>
        </div>

        <div class="check-row">
            <input type="checkbox" id="rememberMe" name="rememberMe">
            <label for="rememberMe">Meni eslab qol</label>
        </div>

        <button type="submit" class="btn-submit">
            <i class='bx bx-log-in'></i> Tizimga kirish
        </button>
    </form>

    <div class="card-footer">
        Akkountingiz yo'qmi?
        <a th:href="@{/auth/register}">Ro'yxatdan o'ting</a>
    </div>
</div>

<script>
    function togglePwd(inputId, btn) {
        var inp = document.getElementById(inputId);
        var icon = btn.querySelector('i');
        if (inp.type === 'password') {
            inp.type = 'text';
            icon.className = 'bx bx-show';
        } else {
            inp.type = 'password';
            icon.className = 'bx bx-hide';
        }
    }
</script>
</body>
</html>
