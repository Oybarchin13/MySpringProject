<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodSwift – Taomlar Ro'yxati</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: sidebar}"></div>
<div th:replace="~{fragments/header :: top-header}"></div>

<main class="fs-main--admin">
    <div class="fs-page">

        <!-- Category chips -->
        <div class="fs-cats" style="padding-top: 8px;">
            <div class="fs-chip active" data-category="ALL">🍽️ Barchasi</div>
            <div class="fs-chip" data-category="SALADS">🥗 Salatlar</div>
            <div class="fs-chip" data-category="SOUPS">🍜 Sho'rvalar</div>
            <div class="fs-chip" data-category="KEBABS">🍢 Kebablar</div>
            <div class="fs-chip" data-category="MEAT_DISHES">🥩 Go'shtli taomlar</div>
            <div class="fs-chip" data-category="CHICKEN_DISHES">🍗 Tovuqli taomlar</div>
            <div class="fs-chip" data-category="FISH_DISHES">🐟 Baliqli taomlar</div>
            <div class="fs-chip" data-category="SIDE_DISHES">🍚 Garnirlar</div>
            <div class="fs-chip" data-category="BURGERS">🍔 Burgerlar</div>
            <div class="fs-chip" data-category="PIZZA">🍕 Pizza</div>
            <div class="fs-chip" data-category="DRINKS">🥤 Ichimliklar</div>
            <div class="fs-chip" data-category="SWEETS">🍰 Shirinliklar</div>
        </div>

        <div class="fs-cards" id="food-container">
            <div th:each="food : ${foods}"
                 th:data-cat="${food.category.name()}"
                 class="fs-card">
                <div class="fs-card__img-wrap">
                    <img class="fs-card__img" th:src="${food.imgUrl}" alt="Taom rasmi">
                    <button class="fs-card__fav">
                        <i class='bx bx-heart'></i>
                    </button>
                </div>
                <div class="fs-card__body">
                    <h3 class="fs-card__name" th:text="${food.foodName}">Taom nomi</h3>
                    <div class="fs-card__row">
                        <div class="fs-card__price">
                            <span th:text="${#numbers.formatDecimal(food.price, 0, 'WHITESPACE', 0, 'POINT')}">0</span>
                            <span>so'm</span>
                        </div>
                        <div class="fs-card__actions">
                            <a th:href="@{/foods/edit/{id}(id=${food.id})}"
                               class="fs-btn fs-btn--blue-ghost fs-btn--sm">
                                <i class='bx bx-edit-alt'></i>
                            </a>
                            <a th:href="@{/foods/delete/{id}(id=${food.id})}"
                               onclick="return confirm('Rostdan ham o\'chirmoqchimisiz?')"
                               class="fs-btn fs-btn--danger-ghost fs-btn--sm">
                                <i class='bx bx-trash'></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="no-foods-msg" class="fs-empty" style="display:none;">
            <i class='bx bx-dish'></i>
            <p>Bu kategoriyada hozircha taom yo'q.</p>
        </div>
    </div>
</main>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        var chips = document.querySelectorAll(".fs-chip");
        var cards = document.querySelectorAll(".fs-card");
        var noMsg = document.getElementById("no-foods-msg");

        chips.forEach(function(chip) {
            chip.addEventListener("click", function () {
                chips.forEach(function(c) { c.classList.remove("active"); });
                this.classList.add("active");
                var cat = this.getAttribute("data-category");
                var count = 0;
                cards.forEach(function(card) {
                    if (cat === "ALL" || card.getAttribute("data-cat") === cat) {
                        card.style.display = "flex"; count++;
                    } else {
                        card.style.display = "none";
                    }
                });
                noMsg.style.display = count > 0 ? "none" : "flex";
            });
        });
    });
</script>
</body>
</html>
