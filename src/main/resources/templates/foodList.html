<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Express 24 - Taomlar Ro'yxati</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #ffffff;
        }

        .cat-chip {
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .cat-chip.active {
            background-color: #FFE600 !important;
            color: #000 !important;
            border-color: #FFE600 !important;
            box-shadow: 0 2px 8px rgba(255, 230, 0, 0.4);
        }

        .food-card {
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

<div th:replace="~{fragments/navbar :: sidebar}"></div>

<main class="flex-1 pt-20 flex flex-col bg-white overflow-y-auto ml-64">

    <div th:replace="~{fragments/header :: top-header}"></div>

    <!-- Category chips — FoodCategory enum bilan to'liq mos -->
    <div class="cats flex gap-3 overflow-x-auto pb-4 mb-8 pt-5">
        <div class="cat-chip active cursor-pointer px-4 py-2 rounded-xl font-semibold text-sm border border-gray-200"
             data-category="ALL">🍽️ Barchasi</div>

        <div class="cat-chip cursor-pointer px-4 py-2 rounded-xl bg-gray-50 text-gray-700 font-semibold text-sm border border-gray-100 hover:bg-gray-100"
             data-category="SALADS">🥗 Salatlar</div>

        <div class="cat-chip cursor-pointer px-4 py-2 rounded-xl bg-gray-50 text-gray-700 font-semibold text-sm border border-gray-100 hover:bg-gray-100"
             data-category="SOUPS">🍜 Sho'rvalar</div>

        <div class="cat-chip cursor-pointer px-4 py-2 rounded-xl bg-gray-50 text-gray-700 font-semibold text-sm border border-gray-100 hover:bg-gray-100"
             data-category="KEBABS">🍢 Kebablar</div>

        <div class="cat-chip cursor-pointer px-4 py-2 rounded-xl bg-gray-50 text-gray-700 font-semibold text-sm border border-gray-100 hover:bg-gray-100"
             data-category="MEAT_DISHES">🥩 Go'shtli taomlar</div>

        <div class="cat-chip cursor-pointer px-4 py-2 rounded-xl bg-gray-50 text-gray-700 font-semibold text-sm border border-gray-100 hover:bg-gray-100"
             data-category="CHICKEN_DISHES">🍗 Tovuqli taomlar</div>

        <div class="cat-chip cursor-pointer px-4 py-2 rounded-xl bg-gray-50 text-gray-700 font-semibold text-sm border border-gray-100 hover:bg-gray-100"
             data-category="FISH_DISHES">🐟 Baliqli taomlar</div>

        <div class="cat-chip cursor-pointer px-4 py-2 rounded-xl bg-gray-50 text-gray-700 font-semibold text-sm border border-gray-100 hover:bg-gray-100"
             data-category="SIDE_DISHES">🍚 Garnirlar</div>

        <div class="cat-chip cursor-pointer px-4 py-2 rounded-xl bg-gray-50 text-gray-700 font-semibold text-sm border border-gray-100 hover:bg-gray-100"
             data-category="BURGERS">🍔 Burgerlar</div>

        <div class="cat-chip cursor-pointer px-4 py-2 rounded-xl bg-gray-50 text-gray-700 font-semibold text-sm border border-gray-100 hover:bg-gray-100"
             data-category="PIZZA">🍕 Pizza</div>

        <div class="cat-chip cursor-pointer px-4 py-2 rounded-xl bg-gray-50 text-gray-700 font-semibold text-sm border border-gray-100 hover:bg-gray-100"
             data-category="DRINKS">🥤 Ichimliklar</div>

        <div class="cat-chip cursor-pointer px-4 py-2 rounded-xl bg-gray-50 text-gray-700 font-semibold text-sm border border-gray-100 hover:bg-gray-100"
             data-category="SWEETS">🍰 Shirinliklar</div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-x-6 gap-y-8" id="food-container">

        <div th:each="food : ${foods}"
             th:data-cat="${food.category.name()}"
             class="food-card flex flex-col bg-white rounded-3xl overflow-hidden shadow-sm border border-gray-100 group">

            <div class="relative overflow-hidden h-48 bg-gray-100">
                <img th:src="${food.imgUrl}" alt="Taom rasmi"
                     class="w-full h-full object-cover group-hover:scale-105 transition-all duration-300">
                <button class="absolute top-3 right-3 bg-white rounded-full w-9 h-9 flex items-center justify-center shadow-md hover:scale-110 transition-all">
                    <i class='bx bx-heart text-gray-400 text-lg'></i>
                </button>
            </div>

            <div class="p-4 flex flex-col gap-2">
                <h3 class="text-sm font-bold text-gray-900 leading-tight" th:text="${food.foodName}">Taom nomi</h3>
                <div class="flex items-center justify-between mt-1">
                    <div class="flex items-baseline gap-1">
                        <span class="text-xl font-extrabold text-gray-900 tracking-tight"
                              th:text="${#numbers.formatDecimal(food.price, 0, 'WHITESPACE', 0, 'POINT')}">0</span>
                        <span class="text-xs font-medium text-gray-400 mb-0.5">сум</span>
                    </div>

                    <div class="flex items-center gap-2">
                        <a th:href="@{/foods/edit/{id}(id=${food.id})}"
                           class="flex items-center gap-1 px-3 py-1.5 rounded-xl border border-blue-200 text-blue-600 text-xs font-semibold hover:bg-blue-50 transition-all">
                            <i class='bx bx-edit-alt text-sm'></i>
                        </a>
                        <a th:href="@{/foods/delete/{id}(id=${food.id})}"
                           onclick="return confirm('Rostdan ham o\'chirmoqchimisiz?')"
                           class="flex items-center gap-1 px-3 py-1.5 rounded-xl border border-red-200 text-red-500 text-xs font-semibold hover:bg-red-50 transition-all">
                            <i class='bx bx-trash text-sm'></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="no-foods-msg" class="hidden flex flex-col items-center justify-center py-20 text-gray-400">
        <i class='bx bx-dish text-6xl mb-3 text-gray-300'></i>
        <p class="text-base font-medium">Bu kategoriyada hozircha taom yo'q.</p>
    </div>
</main>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const chips = document.querySelectorAll(".cat-chip");
        const cards = document.querySelectorAll(".food-card");
        const noFoodsMsg = document.getElementById("no-foods-msg");

        chips.forEach(chip => {
            chip.addEventListener("click", function () {
                // Active klassni boshqarish
                chips.forEach(c => {
                    c.classList.remove("active");
                    c.classList.add("bg-gray-50", "text-gray-700", "border-gray-100");
                    c.classList.remove("bg-[#FFE600]", "text-black");
                });

                this.classList.add("active");
                this.classList.remove("bg-gray-50", "text-gray-700", "border-gray-100");

                // Filtrlash
                const selectedCategory = this.getAttribute("data-category");
                let visibleCount = 0;

                cards.forEach(card => {
                    const cardCategory = card.getAttribute("data-cat");
                    if (selectedCategory === "ALL" || cardCategory === selectedCategory) {
                        card.style.display = "flex";
                        setTimeout(() => card.style.opacity = "1", 10);
                        visibleCount++;
                    } else {
                        card.style.opacity = "0";
                        card.style.display = "none";
                    }
                });

                noFoodsMsg.classList.toggle("hidden", visibleCount > 0);
            });
        });
    });
</script>

</body>
</html>
