<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taom Qo'shish</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f5f7;
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

<div th:replace="~{fragments/navbar :: sidebar}"></div>
<main class="flex-1 flex flex-col bg-white overflow-y-auto ml-64">

    <div th:replace="~{fragments/header :: top-header}"></div>

    <section class="flex-1 px-16  pt-30 py-10 max-w-4xl">
        <h1 class="text-2xl font-extrabold text-black mb-1">Qo'shish</h1>
        <p class="text-xs text-gray-400 mb-8">Yangi kategoriya/taom qo'shish</p>

        <div class="flex gap-4 mb-8">
            <button type="button" class="px-6 py-2 rounded-xl text-sm font-semibold text-gray-500 hover:bg-gray-50 transition-all">Kategoriya</button>
            <button type="button" class="px-6 py-2 rounded-xl text-sm font-bold bg-[#FFE600] text-black shadow-sm transition-all">Taom</button>
        </div>

        <form th:action="@{/foods/add}" th:object="${addFoodSaveDto}" method="POST" class="space-y-5">

            <div class="grid grid-cols-2 gap-5">
                <div>
                    <input type="text" th:field="*{imgUrl}" placeholder="Rasmga yo'l" required
                           class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-[#FFE600] transition-all placeholder-gray-400">
                </div>
                <div>
                    <input type="text" th:field="*{foodName}" placeholder="Taom nomi" required
                           class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-[#FFE600] transition-all placeholder-gray-400">
                </div>
            </div>

            <div>
                    <textarea th:field="*{description}" placeholder="Ta'rif" rows="5" required
                              class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-[#FFE600] transition-all placeholder-gray-400 resize-none"></textarea>
            </div>

            <div class="grid grid-cols-2 gap-5">
                <div>
                    <input type="number" step="0.01" th:field="*{price}" placeholder="Narxi" required
                           class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-[#FFE600] transition-all placeholder-gray-400">
                </div>
                <div class="relative">
                    <select th:field="*{category}" required
                            class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-[#FFE600] transition-all appearance-none text-gray-500 bg-white">

                        <option value="" disabled selected>Kategoriya tanlang</option>

                        <option th:each="cat : ${categories}"
                                th:value="${cat.name()}"
                                th:text="${cat.displayName}">Kategoriya nomi</option>

                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                        <i class='bx bx-chevron-down text-lg'></i>
                    </div>
                </div>
            </div>

            <div class="flex justify-center pt-4">
                <button type="submit" class="w-52 py-3 bg-[#FFE600] text-black font-bold rounded-xl text-sm shadow-md hover:bg-[#ebd500] active:scale-95 transition-all">
                    Qo'shish
                </button>
            </div>
        </form>

    </section>
</main>

<script src="/js/main.js"></script>

</body>
</html>
