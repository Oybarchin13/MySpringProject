<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodSwift – Taom Qo'shish</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: sidebar}"></div>
<div th:replace="~{fragments/header :: top-header}"></div>

<main class="fs-main--admin">
    <div class="fs-page--narrow">

        <div class="fs-page-header">
            <div>
                <h1 class="fs-page-title">Taom qo'shish</h1>
                <p class="fs-page-sub">Yangi taom menyuga qo'shiladi</p>
            </div>
        </div>

        <div class="fs-panel">
            <div class="fs-panel__body">
                <form th:action="@{/foods/add}" th:object="${addFoodSaveDto}" method="POST">
                    <div class="fs-grid-2" style="margin-bottom:20px;">
                        <div class="fs-field" style="margin-bottom:0;">
                            <label class="fs-label">Rasmga yo'l (URL)</label>
                            <input type="text" th:field="*{imgUrl}" placeholder="https://example.com/image.jpg"
                                   class="fs-input" required>
                        </div>
                        <div class="fs-field" style="margin-bottom:0;">
                            <label class="fs-label">Taom nomi</label>
                            <input type="text" th:field="*{foodName}" placeholder="Masalan: Osh, Lag'mon..."
                                   class="fs-input" required>
                        </div>
                    </div>

                    <div class="fs-field">
                        <label class="fs-label">Ta'rif</label>
                        <textarea th:field="*{description}" placeholder="Taom tarkibi, ta'mi haqida yozing..."
                                  rows="4" class="fs-textarea" required></textarea>
                    </div>

                    <div class="fs-grid-2">
                        <div class="fs-field" style="margin-bottom:0;">
                            <label class="fs-label">Narxi (so'm)</label>
                            <input type="number" step="0.01" th:field="*{price}" placeholder="25000"
                                   class="fs-input" required>
                        </div>
                        <div class="fs-field" style="margin-bottom:0;">
                            <label class="fs-label">Kategoriya</label>
                            <div class="fs-select-wrap">
                                <select th:field="*{category}" class="fs-select" required>
                                    <option value="" disabled selected>Kategoriya tanlang</option>
                                    <option th:each="cat : ${categories}"
                                            th:value="${cat.name()}"
                                            th:text="${cat.displayName}">Kategoriya</option>
                                </select>
                                <i class='bx bx-chevron-down'></i>
                            </div>
                        </div>
                    </div>

                    <hr class="fs-divider">

                    <div style="display:flex; justify-content:flex-end; gap:12px;">
                        <a th:href="@{/foods/list}" class="fs-btn fs-btn--ghost">Bekor qilish</a>
                        <button type="submit" class="fs-btn fs-btn--primary">
                            <i class='bx bx-plus'></i> Qo'shish
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </div>
</main>

<script src="/js/main.js"></script>
</body>
</html>
