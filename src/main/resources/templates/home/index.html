<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodSwift – Tez yetkazib berish</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/menu.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/header :: top-header}"></div>

<div class="fs-main">
    <section class="hero-section">
        <div class="hero-left">
            <span class="hero-badge">🚀 Yangi platforma</span>
            <h1 class="hero-title">Mazali taomlar<br>har doim yoningizda!</h1>
            <p class="hero-sub">Endi yanada tez va arzonroq yetkazib beramiz</p>
            <a href="#" class="hero-cta">🛒 &nbsp;Buyurtma berish</a>
        </div>

        <div class="hero-food">
            <img src="https://images.deliveryhero.io/image/fd-pk/LH/pcoo-item-0.png" alt="Taom"
                 onerror="this.src='https://cdn-icons-png.flaticon.com/512/1404/1404945.png'">
        </div>

        <div class="hero-phone-wrap">
            <div class="hero-phone">
                <div class="hero-phone__notch"></div>
                <div class="hero-phone__screen">
                    <div class="hero-phone__logo">⚡ FOODSWIFT</div>
                    <div class="hero-phone__badge">DELIVERY</div>
                    <div class="hero-phone__grid">
                        <div class="hero-phone__item"><div class="emoji">🍔</div><p>Burger</p></div>
                        <div class="hero-phone__item"><div class="emoji">🍕</div><p>Pizza</p></div>
                        <div class="hero-phone__item"><div class="emoji">🥗</div><p>Salat</p></div>
                        <div class="hero-phone__item"><div class="emoji">🥤</div><p>Drinks</p></div>
                    </div>
                    <div class="hero-phone__delivery">
                        <p>🚚 15-25 daqiqada</p>
                        <small>Tezkor yetkazish</small>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div style="max-width: 1200px; margin: 0 auto; padding: 0 20px;">
        <div th:if="${cartSuccess}" style="background-color: #28a745; color: white; padding: 12px 20px; border-radius: 10px; margin-bottom: 20px; text-align: center; font-family: 'Poppins', sans-serif;">
            <i class='bx bx-check-circle'></i> <span th:text="${cartSuccess}"></span>
        </div>
        <div th:if="${cartError}" style="background-color: #dc3545; color: white; padding: 12px 20px; border-radius: 10px; margin-bottom: 20px; text-align: center; font-family: 'Poppins', sans-serif;">
            <i class='bx bx-error-circle'></i> <span th:text="${cartError}"></span>
        </div>
    </div>

    <div th:replace="~{home/food-menu-home :: menu-section}"></div>

    <div class="fs-modal-overlay" id="fsModalOverlay" onclick="fsBgClose(event)">

        <form th:action="@{/cart/add}" method="POST" class="fs-modal-content" id="fsModalContent">

            <input type="hidden" id="formFoodId" name="foodId" value="">
            <input type="hidden" id="formQuantity" name="quantity" value="1">

            <button type="button" class="fs-modal-close" onclick="fsCloseModal()" aria-label="Yopish">
                &times;
            </button>

            <img class="fs-modal-img" id="fsModalImg" src="" alt="Taom rasmi">

            <div class="fs-modal-body">
                <p class="fs-modal-name" id="fsModalName">—</p>

                <p class="fs-modal-unit-price">
                    1 ta narxi: <strong id="fsModalUnitDisplay">0</strong> so'm
                </p>

                <div class="fs-modal-counter-row">
                    <button type="button" class="fs-modal-counter-btn" onclick="fsChangeQty(-1)" aria-label="Kamaytirish">−</button>
                    <span class="fs-modal-qty" id="fsModalQty">1</span>
                    <button type="button" class="fs-modal-counter-btn" onclick="fsChangeQty(+1)" aria-label="Oshirish">+</button>
                </div>

                <div class="fs-modal-total-row">
                    <span class="fs-modal-total-label">Jami summa:</span>
                    <span class="fs-modal-total-price" id="fsModalTotal">0 so'm</span>
                </div>

                <button type="submit" class="fs-modal-submit">
                    <i class='bx bx-cart-add' style="font-size:20px;"></i>
                    В корзину (Savatga)
                </button>
            </div>
        </form>
    </div>

    <script>
        (function () {
            "use strict";

            /* ── Global o'zgaruvchilar ────────────────────────────────── */
            var _currentUnitPrice = 0;
            var _currentQty       = 1;

            /* ── Narxni formatlash (Masalan: 72 000) ─────────────────── */
            function fsFormatPrice(number) {
                return Math.round(number)
                    .toString()
                    .replace(/\B(?=(\d{3})+(?!\d))/g, " ");
            }

            /* ── Jami summani hisoblash va Inputlarni yangilash ──────── */
            function fsUpdateTotal() {
                var total = _currentUnitPrice * _currentQty;

                // Vizual qismni yangilash
                document.getElementById("fsModalTotal").textContent = fsFormatPrice(total) + " so'm";
                document.getElementById("fsModalQty").textContent = _currentQty;

                // FORMADAGI REAL INPUT QIYMATINI YANGILASH (CONTROLLERGA SHU BORADI)
                document.getElementById("formQuantity").value = _currentQty;
            }

            /* ── Modal oynani ochish ────────────────────────────────── */
            window.fsOpenModal = function (btn) {
                var foodId = btn.getAttribute("data-id");
                _currentUnitPrice = parseFloat(btn.getAttribute("data-price")) || 0;
                _currentQty = 1;

                // Formadagi yashirin inputlarga boshlang'ich qiymat berish
                document.getElementById("formFoodId").value = foodId;
                document.getElementById("formQuantity").value = _currentQty;

                // Vizual ma'lumotlarni joylashtirish
                document.getElementById("fsModalImg").src = btn.getAttribute("data-img") || "";
                document.getElementById("fsModalName").textContent = btn.getAttribute("data-name") || "—";
                document.getElementById("fsModalUnitDisplay").textContent = fsFormatPrice(_currentUnitPrice);

                fsUpdateTotal();

                // Modalni ko'rsatish
                document.getElementById("fsModalOverlay").classList.add("fs-modal--open");
                document.body.style.overflow = "hidden";
            };

            /* ── Modal oynani yopish ────────────────────────────────── */
            window.fsCloseModal = function () {
                document.getElementById("fsModalOverlay").classList.remove("fs-modal--open");
                document.body.style.overflow = "";
            };

            /* ── Orqa fonga bosganda yopish ────────────────────────── */
            window.fsBgClose = function (event) {
                if (event.target === document.getElementById("fsModalOverlay")) {
                    fsCloseModal();
                }
            };

            /* ── Soni o'zgarganda hisoblash ─────────────────────────── */
            window.fsChangeQty = function (delta) {
                var next = _currentQty + delta;
                if (next < 1) return; // 1 tadan kamayib ketmasin
                _currentQty = next;
                fsUpdateTotal();
            };

            /* ── Kategoriya filtri va Esc klavishasi ─────────────────── */
            document.addEventListener("DOMContentLoaded", function () {
                var chips   = document.querySelectorAll(".fs-chip");
                var cards   = document.querySelectorAll(".fs-card");
                var noMsg   = document.getElementById("no-foods-msg");

                chips.forEach(function (chip) {
                    chip.addEventListener("click", function () {
                        chips.forEach(function (c) { c.classList.remove("active"); });
                        this.classList.add("active");

                        var cat   = this.getAttribute("data-category");
                        var count = 0;

                        cards.forEach(function (card) {
                            if (cat === "ALL" || card.getAttribute("data-cat") === cat) {
                                card.style.display = "flex";
                                count++;
                            } else {
                                card.style.display = "none";
                            }
                        });

                        noMsg.style.display = count > 0 ? "none" : "flex";
                    });
                });

                /* Escape bosilganda modal yopilsin */
                document.addEventListener("keydown", function (e) {
                    if (e.key === "Escape") fsCloseModal();
                });
            });

        }());
    </script>
</div>

</body>
</html>
