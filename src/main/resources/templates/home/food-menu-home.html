<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"></head>
<body>


<div th:fragment="menu-section" class="fs-section">
    <h2 class="fs-section-title">Barcha taomlar</h2>

    <!-- Kategoriya chiplari -->
    <div class="fs-cats">
        <div class="fs-chip active" data-category="ALL">🍽️ Barchasi</div>
        <div class="fs-chip" data-category="SALADS">🥗 Salatlar</div>
        <div class="fs-chip" data-category="SOUPS">🍜 Sho'rvalar</div>
        <div class="fs-chip" data-category="KEBABS">🍢 Kebablar</div>
        <div class="fs-chip" data-category="MEAT_DISHES">🥩 Go'shtli taomlar</div>
        <div class="fs-chip" data-category="CHICKEN_DISHES">🍗 Tovuqli taomlar</div>
        <div class="fs-chip" data-category="FISH_DISHES">🐟 Baliqli taomlar</div>
        <div class="fs-chip" data-category="SIDE_DISHES">🍚 Garnirlar</div>
        <div class="fs-chip" data-category="BURGERS">🍔 Burgerlar</div>
        <div class="fs-chip" data-category="PIZZA">🍕 Pizza</div>
        <div class="fs-chip" data-category="DRINKS">🥤 Ichimliklar</div>
        <div class="fs-chip" data-category="SWEETS">🍰 Shirinliklar</div>
    </div>

    <!-- Taom kartochalari -->
    <div class="fs-cards" id="food-container">
        <div th:each="food : ${foods}"
             th:data-cat="${food.category.name()}"
             class="fs-card">

            <div class="fs-card__img-wrap">
                <img class="fs-card__img" th:src="${food.imgUrl}" alt="Taom rasmi">
                <button class="fs-card__fav">
                    <i class='bx bx-heart'></i>
                </button>
            </div>

            <div class="fs-card__body">
                <h3 class="fs-card__name" th:text="${food.foodName}">Taom nomi</h3>
                <div class="fs-card__row">
                    <div class="fs-card__price">
                        <span th:text="${#numbers.formatDecimal(food.price, 0, 'WHITESPACE', 0, 'POINT')}">0</span>
                        <span>so'm</span>
                    </div>
                </div>

                <!--
                    "Buyurtma berish" tugmasi.
                    data-* atributlari orqali modal ga ma'lumot uzatiladi.
                    th:attr — bir nechta data atributlarini bir joyda yozish uchun.
                -->
                <button class="fs-card__order-btn"
                        th:attr="
                            data-id=${food.id},
                            data-name=${food.foodName},
                            data-price=${food.price},
                            data-img=${food.imgUrl}
                        "
                        onclick="fsOpenModal(this)">
                    <i class='bx bx-cart-add'></i> Buyurtma berish
                </button>
            </div>
        </div>
    </div>

    <!-- Bo'sh holat -->
    <div id="no-foods-msg" class="fs-empty" style="display:none;">
        <i class='bx bx-dish'></i>
        <p>Bu kategoriyada hozircha taom yo'q.</p>
    </div>
</div>

     lekin fragment ichida ham to'g'ri ishlaydi.

</body>
</html>
