<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodSwift – Taomni Tahrirlash</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/header :: top-header}"></div>
<div th:replace="~{fragments/navbar :: sidebar}"></div>

<main class="fs-main--admin">
    <div class="fs-page--narrow">

        <div class="fs-page-header">
            <div>
                <a th:href="@{/foods/list}" class="fs-back-link">
                    <i class='bx bx-left-arrow-alt'></i> Taomlar ro'yxatiga qaytish
                </a>
                <h1 class="fs-page-title">Taomni tahrirlash</h1>
                <p class="fs-page-sub">FoodSwift boshqaruv paneli orqali menyuni yangilang</p>
            </div>
        </div>

        <div class="fs-panel">
            <form th:action="@{/foods/edit/{id}(id=${addFood.id})}" th:object="${addFood}" method="POST">
                <div class="fs-panel__body">
                    <div style="display:grid; grid-template-columns:1fr 280px; gap:24px;">

                        <!-- Left: Fields -->
                        <div>
                            <div class="fs-field">
                                <label class="fs-label">Taom nomi</label>
                                <input type="text" name="foodName" th:value="*{foodName}"
                                       class="fs-input" required>
                            </div>

                            <div class="fs-field">
                                <label class="fs-label">Narxi (so'm)</label>
                                <input type="number" step="0.01" name="price" th:value="*{price}"
                                       class="fs-input" required>
                            </div>

                            <div class="fs-field">
                                <label class="fs-label">Kategoriya</label>
                                <div class="fs-select-wrap">
                                    <select name="category" class="fs-select">
                                        <option th:each="cat : ${T(uz.pdp.foodswift.model.entity.enums.FoodCategory).values()}"
                                                th:value="${cat}"
                                                th:text="${cat.displayName}"
                                                th:selected="${cat == addFood.category}">Kategoriya</option>
                                    </select>
                                    <i class='bx bx-chevron-down'></i>
                                </div>
                            </div>

                            <div class="fs-field" style="margin-bottom:0;">
                                <label class="fs-label">Tavsif</label>
                                <textarea name="description" rows="4" th:text="*{description}"
                                          class="fs-textarea"
                                          placeholder="Masalliqlar va tarkibi haqida..."></textarea>
                            </div>
                        </div>

                        <!-- Right: Image preview -->
                        <div class="fs-panel" style="padding:20px; display:flex; flex-direction:column; gap:16px;">
                            <div class="fs-field" style="margin-bottom:0;">
                                <label class="fs-label">Rasm URL</label>
                                <input type="url" name="imgUrl" th:value="*{imgUrl}"
                                       class="fs-input"
                                       placeholder="https://example.com/image.jpg"
                                       oninput="updatePreview(this.value)">
                            </div>

                            <div>
                                <label class="fs-label">Ko'rinish</label>
                                <div style="position:relative; border-radius:12px; overflow:hidden; background:var(--gray-1); border:1.5px solid var(--gray-2); aspect-ratio:16/9; display:flex; align-items:center; justify-content:center;">
                                    <img id="imagePreview" th:src="*{imgUrl}" alt="Preview"
                                         style="width:100%; height:100%; object-fit:cover;"
                                         onerror="this.style.display='none'; document.getElementById('placeholderText').style.display='flex';">
                                    <span id="placeholderText" style="display:none; flex-direction:column; align-items:center; color:var(--gray-3); font-size:12px; gap:6px; text-align:center;">
                                        <i class='bx bx-image-alt' style="font-size:28px;"></i>
                                        Rasm URL noto'g'ri
                                    </span>
                                </div>
                            </div>

                            <p style="font-size:11px; color:var(--gray-3); line-height:1.5;">
                                <i class='bx bx-info-circle'></i>
                                Sifatli va to'g'ri URL manzildan foydalaning.
                            </p>
                        </div>
                    </div>
                </div>

                <div class="fs-panel__footer">
                    <a th:href="@{/foods/list}" class="fs-btn fs-btn--ghost">Bekor qilish</a>
                    <button type="submit" class="fs-btn fs-btn--primary">
                        <i class='bx bx-save'></i> O'zgarishlarni saqlash
                    </button>
                </div>
            </form>
        </div>

    </div>
</main>

<script>
    function updatePreview(url) {
        var img = document.getElementById('imagePreview');
        var ph  = document.getElementById('placeholderText');
        if (url) {
            img.src = url;
            img.style.display = 'block';
            ph.style.display = 'none';
        } else {
            img.style.display = 'none';
            ph.style.display = 'flex';
        }
    }
    window.onload = function () {
        var img = document.getElementById('imagePreview');
        if (!img.getAttribute('src')) {
            img.style.display = 'none';
            document.getElementById('placeholderText').style.display = 'flex';
        }
    };
</script>
</body>
</html>
