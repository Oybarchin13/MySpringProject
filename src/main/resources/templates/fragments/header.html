<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head></head>
<body>
<header th:fragment="top-header" class="fs-header">

    <!-- LOGO -->
    <a th:href="@{/}" class="fs-logo">
        <div class="fs-logo__icon">🍕</div>
        <div>
            <div class="fs-logo__name">Food<span>Swift</span></div>
            <div class="fs-logo__sub">Yetkazib berish</div>
        </div>
    </a>

    <!-- SEARCH -->
    <div class="fs-search">
        <i class='bx bx-search fs-search__icon'></i>
        <input type="text" placeholder="Taom, restoran yoki mahsulot qidiring...">
    </div>

    <!-- PROFILE -->
    <div class="fs-profile">

        <div sec:authorize="isAuthenticated()" style="display: flex; align-items: center;">
            <button class="fs-profile__btn" id="profileBtn">
                <div class="fs-profile__avatar">
                    <i class='bx bx-user'></i>
                </div>
                <span class="fs-profile__name" sec:authentication="principal.fullName">Oybarchin</span>
                <i class='bx bx-chevron-down fs-profile__chevron'></i>
            </button>

            <div id="dropdownMenu" class="fs-dropdown">
                <a th:href="@{/profile}">
                    <i class='bx bx-user'></i> Profil
                </a>
                <a th:href="@{/orders}">
                    <i class='bx bx-list-ul'></i> Buyurtmalarim
                </a>
                <a th:href="@{/cart}">
                    <i class='bx bx-cart'></i> Savatcha
                </a>
                <a th:href="@{/users}" sec:authorize="hasRole('ADMIN')">
                    <i class='bx bx-grid-alt'></i> Admin panel
                </a>
                <hr>
                <form th:action="@{/logout}" method="post" style="margin: 0;">
                    <button type="submit" class="danger" style="background: none; border: none; width: 100%; text-align: left; padding: 10px 15px; cursor: pointer; color: var(--danger-color, red); font-family: inherit;">
                        <i class='bx bx-log-out'></i> Chiqish
                    </button>
                </form>
            </div>
        </div>

        <div sec:authorize="!isAuthenticated()" class="fs-auth-buttons" style="display: flex; gap: 10px;">
            <a th:href="@{/auth/login}" class="btn-login" style="padding: 8px 16px; border: 1px solid #ccc; border-radius: 6px; text-decoration: none; color: #333; font-weight: 500;">
                Kirish
            </a>
            <a th:href="@{/auth/register}" class="btn-register" style="padding: 8px 16px; background-color: #ffcc00; border-radius: 6px; text-decoration: none; color: #000; font-weight: 600;">
                Ro'yxatdan o'tish
            </a>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var btn  = document.getElementById('profileBtn');
            var menu = document.getElementById('dropdownMenu');
            if (!btn || !menu) return;
            btn.addEventListener('click', function (e) {
                e.stopPropagation();
                menu.classList.toggle('open');
            });
            document.addEventListener('click', function () {
                menu.classList.remove('open');
            });
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') menu.classList.remove('open');
            });
        });
    </script>
</header>
</body>
</html>
