<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>
<div th:fragment="sidebar" class="fs-sidebar">
    <nav>
        <a th:href="@{/arizalar}" data-key="arizalar" class="fs-sidebar-link">
            <span class="fs-sidebar-link__icon"><i class='bx bx-refresh'></i></span>
            <div class="fs-sidebar-link__text">
                <p class="fs-sidebar-link__title">Arizalar</p>
                <p class="fs-sidebar-link__desc">Yetib kelgan arizalarni kuzating</p>
            </div>
        </a>

        <a th:href="@{/yetkazilgan}" data-key="yetkazilgan" class="fs-sidebar-link">
            <span class="fs-sidebar-link__icon"><i class='bx bx-check-square'></i></span>
            <div class="fs-sidebar-link__text">
                <p class="fs-sidebar-link__title">Yetkazilgan</p>
                <p class="fs-sidebar-link__desc">Yetkazilgan taomlar ro'yxati</p>
            </div>
        </a>

        <a th:href="@{/statistika}" data-key="statistika" class="fs-sidebar-link">
            <span class="fs-sidebar-link__icon"><i class='bx bx-bar-chart-alt-2'></i></span>
            <div class="fs-sidebar-link__text">
                <p class="fs-sidebar-link__title">Statistika</p>
                <p class="fs-sidebar-link__desc">Diagrammali hisobotlar</p>
            </div>
        </a>

        <a th:href="@{/foods/add}" data-key="qoshish" class="fs-sidebar-link">
            <span class="fs-sidebar-link__icon"><i class='bx bx-plus-circle'></i></span>
            <div class="fs-sidebar-link__text">
                <p class="fs-sidebar-link__title">Qo'shish</p>
                <p class="fs-sidebar-link__desc">Yangi taom qo'shish</p>
            </div>
        </a>

        <a th:href="@{/users}" data-key="foydalanuvchilar" class="fs-sidebar-link">
            <span class="fs-sidebar-link__icon"><i class='bx bx-user'></i></span>
            <div class="fs-sidebar-link__text">
                <p class="fs-sidebar-link__title">Foydalanuvchilar</p>
                <p class="fs-sidebar-link__desc">Rollarni boshqarish</p>
            </div>
        </a>

        <a th:href="@{/foods/list}" data-key="menyu" class="fs-sidebar-link">
            <span class="fs-sidebar-link__icon"><i class='bx bx-dish'></i></span>
            <div class="fs-sidebar-link__text">
                <p class="fs-sidebar-link__title">Menyu</p>
                <p class="fs-sidebar-link__desc">Taomlar ro'yxati</p>
            </div>
        </a>
    </nav>

    <script>
        (function () {
            var links = document.querySelectorAll('.fs-sidebar-link');
            var path  = window.location.pathname;
            var rules = [
                { key: 'qoshish',          match: function(p){ return p.startsWith('/foods/add'); }},
                { key: 'menyu',            match: function(p){ return p.startsWith('/foods/list'); }},
                { key: 'foydalanuvchilar', match: function(p){ return p.startsWith('/users'); }},
                { key: 'statistika',       match: function(p){ return p.startsWith('/statistika'); }},
                { key: 'yetkazilgan',      match: function(p){ return p.startsWith('/yetkazilgan'); }},
                { key: 'arizalar',         match: function(p){ return p === '/' || p.startsWith('/arizalar'); }},
            ];
            var active = rules.find(function(r){ return r.match(path); });
            links.forEach(function(link) {
                link.classList.toggle('active', !!(active && link.dataset.key === active.key));
            });
        })();
    </script>
</div>
</body>
</html>
