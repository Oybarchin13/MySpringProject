<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uz">
<head>
    <meta charset="UTF-8">
    <title>FoodSwift – Kelib tushgan arizalar</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: sidebar}"></div>
<div th:replace="~{fragments/header :: top-header}"></div>

<main class="fs-main--admin">
    <div class="fs-page">
        <div class="fs-page-header" style="margin-bottom: 24px;">
            <div>
                <h1 class="fs-page-title">Kelib tushgan arizalar</h1>
                <p class="fs-page-sub">Mijozlar tomonidan hozirgina berilgan buyurtmalar</p>
            </div>
        </div>

        <div class="fs-panel">
            <div class="fs-table-wrap">
                <table class="fs-table" style="width:100%; border-collapse:collapse;">
                    <thead>
                    <tr style="background:#f8f9fa;">
                        <th style="padding:12px;">ID</th>
                        <th style="padding:12px;">Mijoz ismi</th>
                        <th style="padding:12px;">Telefon raqami</th>
                        <th style="padding:12px;">Taomlar</th>
                        <th style="padding:12px;">Umumiy summa</th>
                        <th style="padding:12px;">Amallar</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(orders)}">
                        <td colspan="6" style="text-align:center; padding:30px; color:#aaa;">
                            <i class='bx bx-package' style="font-size:40px;"></i>
                            <p>Yangi arizalar mavjud emas.</p>
                        </td>
                    </tr>
                    <tr th:each="order : ${orders}" style="border-bottom:1px solid #eee;">
                        <td style="padding:12px; font-weight:bold;" th:text="'#' + ${#strings.substring(order.id, 0, 8)}">#ID</td>
                        <td style="padding:12px;" th:text="${order.user.fullName}">Ism</td>
                        <td style="padding:12px; color:#2980b9;" th:text="${order.user.phoneNumber}">+99890</td>
                        <td style="padding:12px;">
                            <div th:each="item : ${order.items}">
                                <span th:text="${item.food.foodName} + ' × ' + ${item.quantity}">Taom</span>
                            </div>
                        </td>
                        <td style="padding:12px; font-weight:600; color:#27ae60;" th:text="${order.totalAmount} + ' so\'m'">0</td>
                        <td style="padding:12px;">
                            <form th:action="@{/arizalar/{id}/accept(id=${order.id})}" method="POST">
                                <button type="submit" class="fs-btn fs-btn--primary fs-btn--sm" style="background:#2ecc71; color:white; border:none; padding:6px 12px; border-radius:4px;">
                                    Qabul qilish
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
</body>
</html>
