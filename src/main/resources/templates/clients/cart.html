<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savat – FoodSwift</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 0;
            color: #1e293b;
        }
        .cart-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .cart-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .cart-wrapper {
            display: flex;
            gap: 30px;
            align-items: flex-start;
        }
        /* Chap tomon: Mahsulotlar ro'yxati */
        .cart-items-list {
            flex: 1;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            padding: 20px;
        }
        .cart-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 16px 0;
            border-bottom: 1px solid #f1f5f9;
        }
        .cart-item:last-child {
            border-bottom: none;
        }
        .cart-item-img {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 12px;
        }
        .cart-item-details {
            flex: 1;
        }
        .cart-item-name {
            font-size: 18px;
            font-weight: 600;
            margin: 0 0 6px 0;
            color: #0f172a;
        }
        .cart-item-price {
            font-size: 15px;
            color: #64748b;
        }
        .cart-item-total {
            font-size: 16px;
            font-weight: 600;
            color: #0f172a;
            min-width: 100px;
            text-align: right;
        }

        /* O'ng tomon: Chek (Summary) */
        .cart-summary {
            width: 320px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            padding: 24px;
            position: sticky;
            top: 40px;
        }
        .summary-title {
            font-size: 20px;
            font-weight: 600;
            margin-0 0 20px 0;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 14px;
            font-size: 15px;
            color: #64748b;
        }
        .summary-total-row {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px dashed #cbd5e1;
            font-size: 18px;
            font-weight: 700;
            color: #0f172a;
        }
        .btn-checkout {
            display: block;
            width: 100%;
            background-color: #28a745;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            margin-top: 24px;
            transition: background 0.2s;
            text-decoration: none;
        }
        .btn-checkout:hover {
            background-color: #218838;
        }
        .back-to-menu {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #64748b;
            text-decoration: none;
            font-size: 15px;
            margin-bottom: 20px;
            transition: color 0.2s;
        }
        .back-to-menu:hover {
            color: #1e293b;
        }

        /* Bo'sh savat holati */
        .empty-cart {
            text-align: center;
            padding: 60px 20px;
        }
        .empty-cart i {
            font-size: 70px;
            color: #cbd5e1;
            margin-bottom: 16px;
        }
        .empty-cart p {
            font-size: 18px;
            color: #64748b;
            margin: 0 0 24px 0;
        }
        /* Savat ichidagi hisoblagich stillari */
        .cart-item-counter-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f1f5f9;
            padding: 6px 12px;
            border-radius: 20px;
            margin: 0 20px;
        }

        .cart-qty-btn {
            border: none;
            background: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            color: #64748b;
            padding: 2px 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s, transform 0.1s;
        }

        .cart-qty-btn:hover {
            color: #0f172a;
        }

        .cart-qty-btn:active {
            transform: scale(0.9);
        }

        .cart-qty-value {
            font-size: 16px;
            font-weight: 600;
            color: #0f172a;
            min-width: 16px;
            text-align: center;
        }

        /* Agar soni 1 ta bo'lsa va yana kamaytirish bosilsa, o'chirish animatsiyasini eslatuvchi qizil effekt */
        .btn-minus:hover {
            color: #dc3545;
        }
        .btn-plus:hover {
            color: #28a745;
        }

        @media (max-width: 768px) {
            .cart-wrapper {
                flex-direction: column;
            }
            .cart-summary {
                width: 100%;
                box-sizing: border-box;
            }
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/header :: top-header}"></div>

<div class="cart-container">

    <a href="/" class="back-to-menu">
        <i class='bx bx-arrow-back'></i> Menyuga qaytish
    </a>

    <h1 class="cart-title">
        <i class='bx bx-shopping-bag'></i> Sizning savatchangiz
    </h1>

    <div th:if="${not #lists.isEmpty(cartItems)}" class="cart-wrapper">

        <div class="cart-items-list">
            <div th:each="item : ${cartItems}" class="cart-item">
                <img class="cart-item-img" th:src="${item.food.imgUrl}" alt="Taom rasmi">

                <div class="cart-item-details">
                    <h3 class="cart-item-name" th:text="${item.food.foodName}">Taom nomi</h3>
                    <div class="cart-item-price">
                        <span th:text="${#numbers.formatDecimal(item.food.price, 0, 'WHITESPACE', 0, 'POINT')}">0</span> so'm
                    </div>
                </div>

                <div class="cart-item-counter-wrapper">
                    <form th:action="@{/cart/update}" method="POST" style="display: inline;">
                        <input type="hidden" name="foodId" th:value="${item.food.id}">
                        <input type="hidden" name="change" value="-1">
                        <button type="submit" class="cart-qty-btn btn-minus">—</button>
                    </form>

                    <span class="cart-qty-value" th:text="${item.quantity}">1</span>

                    <form th:action="@{/cart/update}" method="POST" style="display: inline;">
                        <input type="hidden" name="foodId" th:value="${item.food.id}">
                        <input type="hidden" name="change" value="1">
                        <button type="submit" class="cart-qty-btn btn-plus">+</button>
                    </form>
                </div>

                <div class="cart-item-total">
                    <span th:text="${#numbers.formatDecimal(item.food.price * item.quantity, 0, 'WHITESPACE', 0, 'POINT')}">0</span> so'm
                </div>
            </div>
        </div>

        <div class="cart-summary">
            <h3 class="summary-title">Buyurtma tafsiloti</h3>
            <div class="summary-row">
                <span>Mahsulotlar soni:</span>
                <span th:text="${#lists.size(cartItems)} + ' turdagi'">0</span>
            </div>
            <div class="summary-row">
                <span>Yetkazib berish:</span>
                <span style="color: #28a745; font-weight: 500;">Bepul 🚀</span>
            </div>

            <div class="summary-total-row">
                <span>Jami:</span>
                <span><span th:text="${#numbers.formatDecimal(totalSum, 0, 'WHITESPACE', 0, 'POINT')}">0</span> so'm</span>
            </div>

            <form th:action="@{/cart/checkout}" method="POST" style="margin-top: 20px;">
                <input type="hidden" name="address" value="Toshkent shahri">
                <button type="submit" class="fs-btn fs-btn--primary" style="width: 100%; background: #2ecc71; justify-content: center; gap: 8px;">
                    <i class='bx bx-check-shield'></i> Buyurtmani rasmiylashtirish
                </button>
            </form>
        </div>

    </div>

    <div th:if="${#lists.isEmpty(cartItems)}" class="empty-cart">
        <i class='bx bx-cart-alt'></i>
        <p>Sizning savatchangiz hozircha bo'sh.</p>
        <a href="/" class="btn-checkout" style="display: inline-block; width: auto; padding: 12px 30px;">
            Taom tanlash
        </a>
    </div>

</div>

</body>
</html>
